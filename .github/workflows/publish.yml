name: Publish

on:
  schedule:
    # Every day at 06:05 UTC: build only versions with a new Paper build. Not on
    # the hour, because GitHub delays or drops scheduled runs at busy times.
    - cron: '5 6 * * *'
    # The 1st of each month at 06:05 UTC: rebuild everything on fresh base images
    - cron: '5 6 1 * *'
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: Rebuild every version, even if already published
        type: boolean
        default: false
  push:
    branches: [master]
    # Changes to the image recipe rebuild everything
    paths:
      - Dockerfile
      - build
      - .github/workflows/publish.yml

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out which images need building
        id: plan
        env:
          FORCE: ${{ github.event_name == 'push' || github.event.schedule == '5 6 1 * *' || inputs.rebuild_all == true }}
          FORCE_REASON: ${{ github.event_name == 'push' && 'the image recipe changed on master' || github.event.schedule == '5 6 1 * *' && 'monthly rebuild on fresh base images' || 'manual rebuild requested' }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Rebuilding everything: $FORCE_REASON"
          fi
          matrix=$(./build plan)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          printf 'Images to build: %s\n' "$(printf '%s' "$matrix" | jq length)"

  publish:
    name: Publish ${{ matrix.version }} ${{ matrix.variant }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    environment: docker-hub
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install QEMU for building and testing arm64 images
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      # Ubuntu's podman package is too old for this Dockerfile (no ADD --checksum),
      # so run the build inside the official podman image instead. Logging in
      # inside the container means the credentials are discarded with it, and
      # base image pulls count towards the account's limit rather than the
      # runner's shared IP address. The image is pinned by version tag, not
      # digest, because Quay rebuilds it nightly and deletes old builds.
      - name: Build, test and push
        env:
          PODMAN_IMAGE: quay.io/podman/stable:v5.8
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ matrix.version }}
          PULL_POLICY: missing
        run: |
          docker run --rm --privileged \
            --env DOCKERHUB_USERNAME --env DOCKERHUB_TOKEN --env VARIANT --env VERSION --env PULL_POLICY \
            --volume "$PWD:/src:ro" --workdir /src \
            "$PODMAN_IMAGE" \
            sh -c 'set -eu
              dnf install -y -q jq
              printf "%s" "$DOCKERHUB_TOKEN" | podman login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
              ./build "$VARIANT" "$VERSION"'
