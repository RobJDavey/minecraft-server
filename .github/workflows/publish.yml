name: Publish

on:
  schedule:
    # Every Monday at 06:00 UTC: build only versions with a new Paper build
    - cron: '0 6 * * 1'
    # The 1st of each month at 06:00 UTC: rebuild everything on fresh base images
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: Rebuild every version, even if already published
        type: boolean
        default: false
  push:
    branches: [master]
    # Changes to the image recipe rebuild everything
    paths:
      - Dockerfile
      - build
      - .github/workflows/publish.yml

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out which images need building
        id: plan
        env:
          FORCE: ${{ github.event_name == 'push' || github.event.schedule == '0 6 1 * *' || inputs.rebuild_all == true }}
        run: |
          matrix=$(./build plan)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          printf 'Images to build: %s\n' "$(printf '%s' "$matrix" | jq length)"

  publish:
    name: Publish ${{ matrix.version }} ${{ matrix.variant }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    environment: docker-hub
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install QEMU for building and testing arm64 images
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      # Ubuntu's podman package is too old for this Dockerfile (no ADD --checksum),
      # so run the build inside the official podman image instead. Logging in
      # inside the container means the credentials are discarded with it.
      - name: Build, test and push
        env:
          PODMAN_IMAGE: quay.io/podman/stable:v5.8.9@sha256:55d98815a34b8f796d9bc3130e7ea5eb070ec388c64124d12e876d07df8b7834
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ matrix.version }}
        run: |
          docker run --rm --privileged \
            --env DOCKERHUB_USERNAME --env DOCKERHUB_TOKEN --env VARIANT --env VERSION \
            --volume "$PWD:/src:ro" --workdir /src \
            "$PODMAN_IMAGE" \
            sh -c 'set -eu
              dnf install -y -q jq
              printf "%s" "$DOCKERHUB_TOKEN" | podman login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
              ./build "$VARIANT" "$VERSION"'
