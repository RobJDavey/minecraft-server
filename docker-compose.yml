services:
  minecraft:
    image: robjdavey/minecraft-server:$SERVER_VERSION
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      - TZ=Europe/London
    ports:
      - 25565:25565
    tty: true
    stdin_open: true
    user: 25565:25565
    volumes:
      - data:/minecraft
volumes:
  data:
